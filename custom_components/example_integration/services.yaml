# Services for the Example Integration. Each data action is a service: the
# contract for automations, scripts, voice assistants and other integrations.
# The websocket commands of the panel call the same store methods.
#
# Each entry here must have a matching block under "services" in strings.json
# and in every translations/<lang>.json. hassfest and the translation-parity
# test enforce the pairing.

add_item:
  fields:
    name:
      required: true
      example: "Garage shelf"
      selector:
        text:
    value:
      required: false
      example: 3
      selector:
        number:
          mode: box

update_item:
  fields:
    item_id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
    name:
      required: false
      example: "Garage shelf"
      selector:
        text:
    value:
      required: false
      example: 5
      selector:
        number:
          mode: box

delete_item:
  fields:
    item_id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
