# Prose linting for AI-writing tells ("delve", "it's important to note", em-dash
# overuse, verb tricolons, …) over the user-facing prose surfaces — the docs a user
# reads and the strings Home Assistant renders in its UI.
#
# `lint.yml`'s `vale` job runs this diff-scoped (`filter_mode: added`), so only the
# lines a PR touches are checked: a real gate on new prose, without failing on the
# existing backlog.
#
# Run it locally with `vale sync && vale <paths>` (Vale CLI from
# https://github.com/errata-ai/vale/releases). A clean local run is not proof CI is
# clean — the action pins its own binary and can report hits a locally-installed
# Vale misses. When a run matters, check the rule's regexes directly
# (`styles/ai-tells/<Rule>.yml` is plain YAML `tokens`), and match Vale's scope while
# you do: rules apply per *block*, so a list item plus its continuation lines is one
# string and a pattern like `[^,]+` will happily span sentence boundaries.
#
# For an accepted false positive, either disable the rule for that file here
# (`ai-tells.RuleName = NO`) or wrap the exception inline with
# `<!-- vale ai-tells.RuleName = NO -->` / `<!-- vale ai-tells.RuleName = YES -->`.
#
# There is no automated bump for the pinned release URL below (Dependabot and
# Renovate don't track raw GitHub release URLs) — bump it by hand occasionally.
StylesPath = styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.26.0/ai-tells.zip

[README.md]
BasedOnStyles = ai-tells

[CHANGELOG.md]
BasedOnStyles = ai-tells

[docs/DESIGN.md]
BasedOnStyles = ai-tells

[docs/EVENTS.md]
BasedOnStyles = ai-tells

[docs/INTEGRATING.md]
BasedOnStyles = ai-tells

# The structured-string tier: what Home Assistant actually renders in its UI.
[formats]
json = md
yaml = md

[custom_components/example_integration/strings.json]
BasedOnStyles = ai-tells

[custom_components/example_integration/services.yaml]
BasedOnStyles = ai-tells
# YAML's unquoted `key: Value` mapping syntax trips this rule on every field, so
# in a services file it reports nothing but noise. Real prose colons are still
# covered by EmDash / Semicolon / LabelAndExplain.
ai-tells.ColonUsage = NO

[custom_components/example_integration/frontend/src/locales/en.json]
BasedOnStyles = ai-tells
