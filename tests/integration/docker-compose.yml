services:
  homeassistant:
    # HA_TAG selects the Home Assistant version. It defaults to `stable`, so e2e,
    # integration and the walkthrough capture keep testing what users actually run.
    # The nightly `ha-beta.yml` workflow sets `beta` — that's the early warning that
    # a breaking change is inbound, roughly four weeks before it reaches users.
    image: ghcr.io/home-assistant/home-assistant:${HA_TAG:-stable}
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ../../custom_components:/config/custom_components:ro
    environment:
      - TZ=America/New_York
      # Python dev mode: log never-awaited coroutines, unclosed resources and
      # other mistakes that Python hides by default. The log gate reads them.
      - PYTHONDEVMODE=1
      # asyncio debug mode: log callbacks and tasks that block the loop for
      # more than 100 ms ("Executing <Task ...> took N seconds").
      - PYTHONASYNCIODEBUG=1
    tmpfs:
      - /tmp
