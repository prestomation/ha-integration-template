version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # Python test/lint dependencies.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # Frontend (panel + card) build/test dependencies.
  - package-ecosystem: npm
    directory: "/custom_components/example_integration/frontend"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # Root vitest deps.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # The root vitest is the one Stryker drives. @stryker-mutator/vitest-runner
      # 10.0.0 runs no test per mutant under vitest 5, so every mutant survives and
      # the TypeScript mutation gate reads 0%. A dependency-only PR changes no
      # TypeScript, so only the toolchain smoke run in ci/test-mutation-frontend.sh
      # can see it. Remove this rule when a Stryker vitest runner supports vitest 5.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  # Playwright e2e deps.
  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
    labels: ["dependencies"]
