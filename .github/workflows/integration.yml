name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A job that needs more asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CHANGE THIS when you adapt the template by hand: the domain that the log gate
      # (scripts/check_ha_log.py) watches. scripts/rename.py rewrites it for you.
      INTEGRATION_DOMAIN: example_integration
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # NOTE: deliberately NOT installing pytest-homeassistant-custom-component
      # here — it pulls in pytest-socket, which blocks the real HTTP this tier
      # needs. Only the lightweight REST deps are installed.
      - name: Install integration test deps
        run: pip install pytest requests websockets

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/example_integration/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix custom_components/example_integration/frontend

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Start Home Assistant
        working-directory: tests/integration
        run: docker compose up -d

      - name: Wait for Home Assistant to start
        run: |
          echo "Waiting for Home Assistant..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/api/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Home Assistant is responding (HTTP $code, attempt $i)"
              exit 0
            fi
            echo "Attempt $i/60 - HTTP $code - waiting..."
            sleep 2
          done
          echo "Home Assistant failed to start within 120s"
          (cd tests/integration && docker compose logs)
          exit 1

      - name: Run integration tests
        run: bash ci/test-python-integration.sh

      - name: Save Home Assistant log
        if: always()
        working-directory: tests/integration
        run: docker compose logs --no-color homeassistant > "$GITHUB_WORKSPACE/ha.log"

      - name: Upload Home Assistant log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ha-log
          path: ha.log
          if-no-files-found: warn

      # The log must have no warnings or errors from our code, no "Detected blocking
      # call" for our domain, and no known bad pattern. Add an exception to
      # scripts/ha_log_allowlist.txt (with a reason). The container runs in Python
      # dev mode (see tests/integration/docker-compose.yml) so these show up.
      - name: Check Home Assistant log
        if: always()
        run: python scripts/check_ha_log.py --domain "$INTEGRATION_DOMAIN" ha.log

      # Last, so the container runs until the log is saved and checked.
      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
