name: pytest and coverage

# Posts a coverage summary (and a per-file diff) as a PR comment, so a change that
# adds untested code is visible in review rather than only in a report nobody opens.
# Coverage is a *signal*, not a gate — the gate is mutation.yml, which asks the
# harder question of whether a test would have failed had the line been wrong.
#
# Split across two workflows on purpose: this one runs with the PR's own (untrusted)
# code and only uploads an artifact; post_coverage_to_pr.yml runs from the base
# branch with write permissions and posts it. See
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest and coverage report
    if: ${{ !(github.event_name == 'pull_request' && ( contains(github.event.pull_request.labels.*.name, 'dependencies') || github.event.pull_request.user.type == 'Bot' )) }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # The unit + component tiers only. The Docker integration tier needs a live
      # container and real sockets, which pytest-socket (pulled in by the HA
      # harness installed above) blocks — the two cannot share an invocation.
      - name: Run unit + component tests with coverage
        run: |
          python -m pytest tests/unit tests/component -o asyncio_mode=auto \
            --cov=custom_components/example_integration --cov-report=term-missing

      - name: "Generate coverage Comment (and possibly Post to PR)"
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR Comment to be Posted
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1
