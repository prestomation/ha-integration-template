name: Dependabot auto-merge

# Auto-merges Dependabot PRs (github-actions, pip, npm — see .github/dependabot.yml)
# once EVERY check on the PR is green, for any bump including majors — we trust CI to
# catch breakage.
#
# `ci/wait_for_checks.py` polls `gh pr checks --json` until all checks on the PR
# finish, and exits non-zero on any failure, so the merge step below only runs when
# everything is actually green. It leaves out this workflow: its own job is a check
# on the PR, so it stays pending until the job ends. `gh pr checks --watch` waits on
# it until the timeout cancels the run, and no Dependabot PR merges. Add an
# `--ignore-workflow` for each workflow that needs a secret: a Dependabot run gets no
# secrets, so such a workflow fails on every Dependabot PR.
# The merge carries --match-head-commit, so a push after the checks ran cannot merge
# without its own checks.
#
# This does NOT rely on GitHub's branch-protection "required status checks" list,
# unlike `gh pr merge --auto`, which only waits for whichever checks are marked
# required there. That list is kept by hand and drifts out of sync with the actual
# jobs. In the incident this replaced, a major dependency bump merged 65 seconds
# after its own `test` job failed. Keep required status checks configured too (Settings → Branches) as
# defense-in-depth for human squash-merges, but don't depend on it here.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Wait for all checks, then merge
        run: |
          python3 ci/wait_for_checks.py "$PR_URL" \
            --ignore-workflow "Dependabot auto-merge" \
            --interval 15 --timeout 2700
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
