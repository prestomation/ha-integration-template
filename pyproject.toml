[tool.pytest.ini_options]
testpaths = ["tests"]
# Note: asyncio_mode is set per-invocation by the component/integration runners
# (it requires the pytest-asyncio plugin, which only the HA harness installs).
# The pure unit tier (tests/unit) needs no asyncio config.

[tool.coverage.run]
source = ["custom_components/example_integration"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Mutation testing (ci/test-mutation-python.sh). Coverage says a line ran;
# mutation testing says a test would have *failed* if that line were wrong.
[tool.mutmut]
source_paths = ["custom_components/example_integration"]
# The mutable surface: the pure core, which the fast `tests/unit` tier covers
# directly. Everything else in the integration imports Home Assistant and is
# only exercised by the component and Docker tiers — far too slow to run once
# per mutant, and scoring it here would just report noise.
only_mutate = [
    "custom_components/example_integration/models.py",
    "custom_components/example_integration/events.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.mutation-gate]
# Minimum mutation score, in percent, for both languages. The TypeScript side
# reads its copy from `thresholds.break` in stryker.conf.json — keep them equal.
break = 80

# Strict typing is a Platinum quality-scale practice. CI (lint.yml) runs `mypy
# custom_components/example_integration` with Home Assistant installed so HA's own
# types resolve; keep the integration error-free. The template demonstrates the
# practice without declaring a quality_scale tier in the manifest (see README).
# Target 3.13 to match modern Home Assistant (it uses 3.13-only typing syntax, so a
# lower target makes mypy fail to even parse HA's own sources).
[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# A pragmatic-but-meaningful set: pyflakes/pycodestyle, import sorting, pyupgrade,
# bugbear, comprehensions, simplify, and Ruff's own rules. Mirrors the spirit of
# Home Assistant core's linting without being maximally pedantic.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Treat Home Assistant as a third-party package (it is, for a custom component).
known-third-party = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and slightly looser style.
"tests/**" = ["B011"]

