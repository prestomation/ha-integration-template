[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `from asserts import raises_exactly` (tests/unit/asserts.py) resolve
# explicitly. Without it the import works only by accident: pytest's default import
# mode puts each test file's own directory on sys.path, so it would break the moment
# a unit test moved into a subdirectory. This adds no *source* path, so it does not
# change how mutmut derives a mutant's module name.
pythonpath = ["tests/unit"]
# Note: asyncio_mode is set per-invocation by the component/integration runners
# (it requires the pytest-asyncio plugin, which only the HA harness installs).
# The pure unit tier (tests/unit) needs no asyncio config.

[tool.coverage.run]
branch = true
source = ["custom_components/example_integration"]
# Store paths relative to the repo root rather than absolute. `pytest_coverage.yml`
# hands `.coverage` to py-cov-action, which runs `coverage json` inside a Docker
# container where the workspace is mounted at a different path — an absolute
# `/home/runner/work/…` recorded by the runner does not exist there, and the action
# dies with "No source for code". Nothing surfaces this locally: `coverage json` in
# the repo root relativizes such paths against the cwd they already sit under.
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Mutation testing (ci/test-mutation-python.sh). Coverage says a line ran;
# mutation testing says a test would have *failed* if that line were wrong.
[tool.mutmut]
source_paths = ["custom_components/example_integration"]
# mutmut runs the suite inside a `mutants/` copy that holds only the source paths
# and the tests, so a unit test that reads a repo file off disk dies at collection
# unless that file is listed here. `tests/unit/test_ci_check_ha_version.py` and
# `test_check_changelog_release_gap.py` load their scripts from `ci/` by path (the
# hyphenated filenames are not importable), and `test_integration_fixture_clean.py`
# reads the seeded Docker-tier fixture. The trap is that this only breaks a PR that
# also touches mutable Python — every other PR skips mutmut entirely and never finds
# out. Directories, not bare files: mutmut `copy2`s a file without creating its
# parent, and only `copytree`s a directory into place.
# `test_release_issues.py` reads CHANGELOG.md at *import* time (its parametrize
# enumerates the released versions), and `test_ci_release_publish_gate.py` reads
# `.github/workflows/release.yml` to run the release workflow's publish decision.
# `test_generate_api_docs.py` reads `website/scripts/doc-map.mjs` to check the page's
# front matter against the route it is published at. `test_pure_core.py` reads the
# design doc's module map and both mutation thresholds, and `test_rename.py` copies
# `scripts/rename.py`.
also_copy = [
    "ci",
    "tests/integration/ha_config",
    "CHANGELOG.md",
    ".github/workflows",
    "website/scripts",
    "docs",
    "scripts",
    "stryker.conf.json",
    "pyproject.toml",
]
# The mutable surface: the pure core, which the fast `tests/unit` tier covers
# directly. Everything else in the integration imports Home Assistant and is
# only exercised by the component and Docker tiers — far too slow to run once
# per mutant, and scoring it here would just report noise. Also excluded:
# const.py and api_surface.py, which are data rather than logic — api_surface is
# a declarative index of the integration's surfaces, pinned by
# tests/unit/test_api_surface.py against the real registrations rather than by
# behavioural assertions.
only_mutate = [
    "custom_components/example_integration/models.py",
    "custom_components/example_integration/events.py",
]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.mutation-gate]
# Minimum mutation score, in percent, for both languages. The TypeScript side
# reads its copy from `thresholds.break` in stryker.conf.json — keep them equal.
break = 80

# ci/docs.py: the docs CLI and the docs gate (lint.yml, `docs-audit`). A doc's kind
# comes from the first glob here that matches its path; `strip` is cut from the path
# to make the doc id. A kind with no cap (the user guide) gets only the link check.
[tool.docs-audit]
line_width = 100
max_exceptions = 2
duplicate_min_words = 12
# Every file here must be in at least one design doc's `implements`.
coverage = [
    "custom_components/example_integration/*.py",
    "custom_components/example_integration/frontend/src/**/*.ts",
]
uncovered = []
link_scan = ["**/*.md"]
link_skip = [
    "CHANGELOG.md",
    "**/node_modules/**",
    "website/docs/guide/**",
    "website/developer/**",
]
# Where a backticked file or `module.func` reference may live.
code_dirs = [
    "custom_components/example_integration",
    "custom_components/example_integration/frontend/src",
    "custom_components/example_integration/frontend",
    "ci",
    "tests",
    "docs",
    "website/scripts",
]
code_ref_ignore = ["**/dist/**", "dist/**", "docs/videos/**"]
# Files whose text is searched for a `docs/...md` path that must exist.
# Test fixtures name docs that do not exist on purpose.
doc_ref_skip = ["tests/frontend/**", "tests/unit/test_docs_cli.py"]
doc_ref_suffixes = [
    ".py", ".ts", ".js", ".mjs", ".md", ".yml", ".yaml", ".toml", ".sh", ".ini", ".json",
]
budgets = [{ files = ["CLAUDE.md", "AGENTS.md"], max_lines = 250 }]
kinds = [
    { glob = "docs/design/*.md", kind = "design", strip = "docs/design/" },
    { glob = "docs/guide/**/*.md", kind = "guide", strip = "docs/" },
    { glob = "docs/*.md", kind = "reference", strip = "docs/" },
    { glob = ".amazonq/rules/*.md", kind = "rules", strip = ".amazonq/" },
    { glob = ".claude/skills/**/*.md", kind = "skill", strip = ".claude/skills/" },
    { glob = "AGENTS.md", kind = "process" },
    { glob = "CLAUDE.md", kind = "process" },
    { glob = "RELEASE.md", kind = "process" },
    { glob = "website/README.md", kind = "process" },
    { glob = "IDEAS.md", kind = "backlog" },
]

[tool.docs-audit.caps]
design = 150
reference = 300
rules = 200
process = 200
backlog = 300
skill = 200

# Text that tells history instead of the current design. Prose only; code spans and
# fences are not checked.
[tool.docs-audit.history]
all = [
    '(?i)\bthis PR\b',
    '\bPR #\d+',
    '(?i)\boriginally\b',
    '(?i)\bpreviously\b',
    '(?i)\bwe first\b',
    '(?i)\bused to be\b',
    '(?i)\bhistorically\b',
    '\bPhase \d',
    'Status:',
    '(?i)\bwritten (in )?(january|february|march|april|may|june|july|august|september|october|november|december) \d{4}',
]
design = ['(?<![\w/&-])#\d{2,}\b']

# Strict typing is a Platinum quality-scale practice. CI (lint.yml) runs `mypy
# custom_components/example_integration` with Home Assistant installed so HA's own
# types resolve; keep the integration error-free. The template demonstrates the
# practice without declaring a quality_scale tier in the manifest (see README).
[tool.mypy]
# Tracks the Python floor Home Assistant itself requires, not the integration's.
# HA's source uses syntax from its own minimum Python — 2026.3 raised the floor to
# 3.14.2, and 2026.8 uses PEP 758 parenthesis-free `except A, B:` — which mypy
# cannot even *parse* when targeting an older version. It bails with a syntax error
# inside HA and reports nothing about our code, so this silently stops being a gate.
# Keep it in step with the mypy job's `python-version` in lint.yml.
python_version = "3.14"
# Home Assistant 2026.9 and later alias `voluptuous` to probatio at run time, and
# 2026.10 types its schema arguments with probatio classes. hass-nabucasa still
# installs the real voluptuous, so mypy can read `import voluptuous as vol` as a
# different class and reject each schema that the integration passes in. The stubs
# in `typings/` point `voluptuous` at probatio for mypy only, as Home Assistant
# core's `stubs/voluptuous` does. Remove them when the code imports probatio.
mypy_path = "typings"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# A pragmatic-but-meaningful set: pyflakes/pycodestyle, import sorting, pyupgrade,
# bugbear, comprehensions, simplify, and Ruff's own rules. Mirrors the spirit of
# Home Assistant core's linting without being maximally pedantic.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Treat Home Assistant as a third-party package (it is, for a custom component).
known-third-party = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and slightly looser style.
"tests/**" = ["B011"]

